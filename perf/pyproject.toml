# Performance tools for the search (see the README's Performance section). Development only:
# a separate project so none of it ships in the API image. Run from this directory.
[project]
name = "swayambhu-perf"
version = "0.1.0"
description = "Search performance benchmarks for the Swayambhu Stories Searchable Archive"
requires-python = ">=3.12"
dependencies = [
    "swayambhu-api",
    "numpy>=2.0",
    "pyarrow>=21",  # reads the Wikipedia parquet export for perf.corpus
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayambhu_perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Postgres with pgvector (set DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
packages = ["swayambhu_perf"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.coverage.run]
source = ["swayambhu_perf"]
branch = true

[tool.uv.sources]
swayambhu-api = { path = "../services/api", editable = true }
swayambhu-core = { path = "../packages/core", editable = true }
swayambhu-providers = { path = "../packages/providers", editable = true }
