[project]
name = "swayambhu-api"
version = "0.1.0"
description = "FastAPI backend for the Swayambhu Stories Searchable Archive"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3",
    "swayambhu-core",
    "swayambhu-providers",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-cov>=5",
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayambhu_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Postgres with pgvector (set DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
packages = ["swayambhu_api"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.coverage.run]
source = ["swayambhu_api"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv.sources]
swayambhu-core = { path = "../../packages/core", editable = true }
swayambhu-providers = { path = "../../packages/providers", editable = true }
