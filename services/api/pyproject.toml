[project]
name = "swayambhu-api"
version = "0.1.0"
description = "FastAPI backend for the Swayambhu Stories Searchable Archive"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayambhu_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Postgres with pgvector (set DATABASE_URL)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
packages = ["swayambhu_api"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
