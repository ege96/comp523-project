# Local development stack. Production runs on CloudApps (OpenShift); manifests come later.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swayambhu
      # Local-only database: no password, and the port is bound to localhost only.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: swayambhu
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swayambhu"]
      interval: 5s
      retries: 10

  # Applies migrations on startup (services/api/start.sh), then serves.
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://swayambhu@db:5432/swayambhu
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-comp523}
      # Offline stand-ins so local dev needs no API keys. Must match the worker's.
      EMBEDDING_PROVIDER: fake
    ports: ["8000:8080"]
    # The API streams playback copies and receives uploads here, so it shares the worker's
    # media volume (as the api and worker pods share one volume in CloudApps).
    volumes:
      - media:/data/media
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    environment:
      DATABASE_URL: postgresql://swayambhu@db:5432/swayambhu
      TRANSCRIPTION_PROVIDER: fake
      TRANSLATION_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    volumes:
      - media:/data/media
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  # Uploaded recordings (LocalMediaStore). Try it: docker compose cp talk.mp3 worker:/tmp/ &&
  # docker compose exec worker python -m swayambhu_worker.ingest /tmp/talk.mp3 --title Test
  media:
