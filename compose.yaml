# Local development stack. Production runs on CloudApps (OpenShift); manifests come later.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swayambhu
      # Local-only database: no password, and the port is bound to localhost only.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: swayambhu
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swayambhu"]
      interval: 5s
      retries: 10

  api:
    build: services/api
    environment:
      DATABASE_URL: postgresql://swayambhu@db:5432/swayambhu
    ports: ["8000:8080"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: services/worker
    environment:
      DATABASE_URL: postgresql://swayambhu@db:5432/swayambhu
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
