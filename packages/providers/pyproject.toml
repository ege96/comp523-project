[project]
name = "swayambhu-providers"
version = "0.1.0"
description = "Swappable transcription, translation and embedding providers, shared by the API and worker"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "httpx2>=2.13",
    # `local` embedder: ONNX Runtime on CPU, no torch (keeps the images small).
    "onnxruntime>=1.22",
    "tokenizers>=0.21",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-cov>=5",
    "onnx>=1.18",  # builds a tiny model for the local embedder tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayambhu_providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["swayambhu_providers"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.coverage.run]
source = ["swayambhu_providers"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
