[project]
name = "swayambhu-core"
version = "0.1.0"
description = "Database models, job queue and media storage, shared by the API and worker"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayambhu_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["swayambhu_core"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.coverage.run]
source = ["swayambhu_core"]
branch = true
# Need a database: covered by the api and worker integration tests instead.
omit = [
    "*/swayambhu_core/models.py",
    "*/swayambhu_core/jobs.py",
    "*/swayambhu_core/languages.py",
    "*/swayambhu_core/transcripts.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
