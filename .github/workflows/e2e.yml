name: E2E

# Browser smoke tests (apps/web/e2e) against the compose stack with fake providers.
# Optional: not in the main ruleset's required checks, so a red run never blocks a merge.
on:
  pull_request:
    paths: ["apps/web/**", "services/**", "packages/**", "compose*.yaml", ".github/workflows/e2e.yml"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Start the stack
        run: |
          # Made before compose starts, so Docker doesn't create it owned by root.
          mkdir -p e2e/.auth/jwks
          docker compose -f ../../compose.yaml -f ../../compose.e2e.yaml up -d --build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f ../../compose.yaml -f ../../compose.e2e.yaml logs --no-color api worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          retention-days: 7
