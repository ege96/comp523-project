name: CloudApps build

# Calls the CloudApps (OpenShift) Generic webhook of each app whose files changed on main.
# Changes are counted from the commit the last successful run built, so a push that got
# no run, or whose run failed, is caught up by the next one. A manual run rebuilds all.
# Setup: cloudapps_deploy.md §8 A2.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudapps-build
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trigger builds for changed apps
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          WEBHOOK_API: ${{ secrets.OPENSHIFT_WEBHOOK_API }}
          WEBHOOK_WEB: ${{ secrets.OPENSHIFT_WEBHOOK_WEB }}
          WEBHOOK_WORKER: ${{ secrets.OPENSHIFT_WEBHOOK_WORKER }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudapps-build.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ "$EVENT" = push ] && [ -n "$base" ] && git merge-base --is-ancestor "$base" "$SHA" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$SHA")
          else
            changed=ALL
          fi
          printf 'Since %s:\n%s\n' "${base:-start}" "$changed"

          build() {
            app=$1 url=$2; shift 2
            if [ "$changed" != ALL ]; then
              hit=false
              for prefix; do
                case $'\n'"$changed" in *$'\n'"$prefix"*) hit=true ;; esac
              done
              if [ "$hit" = false ]; then echo "$app: unchanged"; return; fi
            fi
            if [ -z "$url" ]; then echo "::warning::$app: webhook secret not set"; return; fi
            curl -fsS --retry 3 -X POST -o /dev/null "$url"
            echo "$app: build started"
          }
          # api and worker build from the repo root and include packages/.
          build api "$WEBHOOK_API" services/api/ packages/ .dockerignore
          build worker "$WEBHOOK_WORKER" services/worker/ packages/ .dockerignore
          build web "$WEBHOOK_WEB" apps/web/
