name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      db:
        # Same image as compose.yaml; Dependabot doesn't update this line, so bump both together.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swayambhu
          # Integration tests only run against a database whose name ends in _test.
          POSTGRES_DB: swayambhu_test
          # Throwaway CI database: no password, so nothing secret-shaped is committed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swayambhu"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://swayambhu@localhost:5432/swayambhu_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off
      # Unit and integration tests together, so coverage counts the routes that only make
      # sense against Postgres (interviews, uploads).
      - name: Test against Postgres + pgvector
        run: |
          for f in ../../db/init/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
          uv run python -m swayambhu_api.migrate upgrade head
          uv run python -m swayambhu_api.migrate check
          uv run pytest --cov -m ""

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swayambhu
          POSTGRES_DB: swayambhu_worker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swayambhu"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://swayambhu@localhost:5432/swayambhu_worker_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install FFmpeg (the static build the worker image uses; bump both together)
        run: |
          id=$(docker create mwader/static-ffmpeg:9.0.2-1)
          sudo docker cp "$id:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$id:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$id"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Unit and integration tests together: the pipeline is only covered against Postgres.
      - run: uv run pytest --cov -m ""
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  core:
    # packages/core: database models, job queue and storage shared by the api and worker images.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  providers:
    # packages/providers: AI provider interfaces shared by the api and worker images.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/providers
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # No install scripts: blocks the usual npm supply-chain attack. The build doesn't need them.
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Lint and format hooks are skipped here: the api, worker and web jobs already run them.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-api,ruff-format-api,ruff-worker,ruff-format-worker,ruff-core,ruff-format-core,ruff-providers,ruff-format-providers,prettier-web,eslint-web

  docker:
    # Builds each image (no push), checks it runs as an arbitrary non-root UID the way
    # OpenShift starts containers, and reports its size. Layers are cached between runs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: apps/web
            smoke: |
              docker run -d --name app --user 1000680000:0 -p 8080:8080 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8080/ >/dev/null && break; sleep 1; done
              curl -fsS localhost:8080/ | grep -q '<div id="root">'
              # Security headers and cache rules (apps/web/nginx.conf, security-headers.inc).
              headers=$(curl -fsSI localhost:8080/)
              for h in "content-security-policy: default-src 'self'" "x-content-type-options: nosniff" \
                       "referrer-policy:" "strict-transport-security:" "cache-control: no-cache" \
                       "cross-origin-opener-policy: same-origin-allow-popups"; do
                grep -qi "^$h" <<<"$headers" || { echo "missing on /: $h"; exit 1; }
              done
              asset=$(curl -fsS localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
              curl -fsSI -H 'Accept-Encoding: gzip' "localhost:8080$asset" > asset-headers
              grep -qi '^cache-control: public, max-age=31536000, immutable' asset-headers
              grep -qi '^content-encoding: gzip' asset-headers
              grep -qi '^x-content-type-options: nosniff' asset-headers
          - name: api
            # `context` names the check (required by the main ruleset); the build itself
            # runs from the repo root so the image can install packages/.
            context: services/api
            build_context: .
            smoke: |
              # No database here, so skip the startup migration.
              docker run -d --name app --user 1000680000:0 -e RUN_MIGRATIONS=0 -p 8080:8080 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8080/api/health && break; sleep 1; done
              curl -fsS localhost:8080/api/health | grep -q '"ok"'
              # The baked-in local embedding model loads, and a Nepali passage about the stupa
              # is closer to an English query about it than an unrelated passage is.
              docker run --rm --user 1000680000:0 -e EMBEDDING_PROVIDER=local \
                -e EMBEDDING_MODEL=intfloat/multilingual-e5-small \
                -e EMBEDDING_QUERY_PREFIX="query: " -e EMBEDDING_PASSAGE_PREFIX="passage: " \
                "$IMAGE" python -c '
              from swayambhu_providers.factory import build_embedder
              from swayambhu_providers.settings import ProviderSettings
              e = build_embedder(ProviderSettings())
              [q] = e.embed(["Swayambhu stupa"], "query")
              near, far = e.embed(["स्वयम्भू स्तूप काठमाडौंमा छ।", "The train leaves at noon."], "passage")
              dot = lambda a, b: sum(x * y for x, y in zip(a, b))
              assert len(q) == 384, len(q)
              assert dot(q, near) > dot(q, far), (dot(q, near), dot(q, far))
              '
          - name: worker
            context: services/worker
            build_context: .
            smoke: |
              docker run --rm --user 1000680000:0 "$IMAGE" python -c "import swayambhu_worker.__main__"
              docker run --rm --user 1000680000:0 "$IMAGE" test -s /opt/models/intfloat/multilingual-e5-small/onnx/model.onnx
              docker run --rm --user 1000680000:0 "$IMAGE" ffmpeg -hide_banner -version
              docker run --rm --user 1000680000:0 "$IMAGE" ffprobe -hide_banner -version
    name: docker (${{ matrix.context }})
    env:
      IMAGE: swayambhu-${{ matrix.name }}:ci
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.build_context || matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Smoke test as an arbitrary UID
        run: ${{ matrix.smoke }}
      - name: Report image size
        if: always()
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec)
          echo "::notice title=${{ matrix.name }} image size::$size"
          {
            echo "### ${{ matrix.name }} image: $size"
            echo '```'
            docker history --format 'table {{.Size}}\t{{.CreatedBy}}' "$IMAGE" | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
