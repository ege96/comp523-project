version: 2

# Every ecosystem below is part of one multi-ecosystem group, so a week's version updates
# arrive as a single PR (Python locks, npm, Actions, base images and compose together)
# instead of one per directory. Security updates still come as their own PRs.
multi-ecosystem-groups:
  weekly:
    schedule: { interval: weekly }

updates:
  - package-ecosystem: uv
    directories: [/services/api, /services/worker, /packages/core, /packages/providers, /perf]
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: npm
    directory: /apps/web
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. Lift once it supports newer.
      - dependency-name: typescript
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly

  # Base images. Python minor versions and nginx minor versions (odd = mainline) are moved by
  # hand, since requires-python and CI change with Python, and nginx should stay on stable.
  - package-ecosystem: docker
    directories: [/apps/web, /services/api, /services/worker]
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Local dev database. A Postgres major upgrade (pg16 -> pg17) needs a dump and restore, so
  # it is never automatic. CI's service container (.github/workflows/ci.yml) uses the same
  # image and isn't covered by Dependabot: keep the two in step by hand.
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: pgvector/pgvector
        update-types: ["version-update:semver-major"]
